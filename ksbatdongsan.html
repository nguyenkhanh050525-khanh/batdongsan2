<!DOCTYPE html>
<html>

<head>
    <title>Khảo sát ý kiến về bất động sản</title>
</head>

<body>

<form action="" method="">

<table border="1" width="700" align="center">

    <tr bgcolor="lightblue">
        <th>
            KHẢO SÁT Ý KIẾN VỀ BẤT ĐỘNG SẢN
        </th>
    </tr>

    <tr>
        <td>
            <fieldset>
                <legend>Thông tin người khảo sát</legend>

                <label for="hoten">Họ tên:</label>
                <input type="text" id="hoten" name="hoten">
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br><br>

                <label for="sdt">Số điện thoại:</label>
                <input type="text" id="sdt" name="sdt">

            </fieldset>

            <br>
            <fieldset>
                <legend>Ý kiến về bất động sản</legend>

                <label for="loai">Loại bất động sản bạn quan tâm:</label>
                <select id="loai" name="loai">
                    <option>Căn hộ chung cư</option>
                    <option>Nhà riêng</option>
                    <option>Đất nền</option>
                    <option>Biệt thự</option>
                </select>

                <br><br>

                <label>Khoảng giá bạn quan tâm:</label>
                <br>
                <input type="radio" name="gia"> Dưới 1 tỷ
                <input type="radio" name="gia"> 1 - 2 tỷ
                <input type="radio" name="gia"> 2 - 5 tỷ
                <input type="radio" name="gia"> Trên 5 tỷ

                <br><br>

                <label>Khu vực bạn quan tâm:</label>
                <br>
                <input type="checkbox" name="khuvuc"> Hà Nội
                <input type="checkbox" name="khuvuc"> Thái Nguyên
                <input type="checkbox" name="khuvuc"> Hải Phòng
                <input type="checkbox" name="khuvuc"> Quảng Ninh

                <br><br>

                <label>Bạn đánh giá thị trường bất động sản hiện nay:</label>
                <br>
                <input type="radio" name="danhgia"> Rất tốt
                <input type="radio" name="danhgia"> Tốt
                <input type="radio" name="danhgia"> Bình thường
                <input type="radio" name="danhgia"> Chưa tốt

                <br><br>

                <label for="ykien">Ý kiến đóng góp:</label>
                <br>
                <textarea id="ykien" name="ykien" rows="5" cols="60"></textarea>

            </fieldset>

        </td>
    </tr>

    <tr bgcolor="lightblue">
        <td align="center">
            <input type="submit" value="Gửi khảo sát">
            <input type="reset" value="Nhập lại">
        </td>
    </tr>

</table>

</form>

</body>
